services:
  # Backend Web Service
  - type: web
    name: hotel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TIME
        value: 900000
      - key: JWT_REFRESH_TIME
        value: 604800000
      - key: SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173"

  # Frontend Static Site
  - type: web
    name: hotel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hotel-backend
          property: host
